services:
  db:
    image: postgres:16-alpine
    container_name: hseq_db
    environment:
      POSTGRES_DB: hseq
      POSTGRES_USER: hseq
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hseq -d hseq"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hseq_api
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: postgresql://hseq:${DB_PASSWORD}@db:5432/hseq
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # La API solo escucha en 127.0.0.1; Nginx/Cloudflare van delante y fijan la IP real.
      # Poner TRUST_PROXY=false si se expone el puerto directamente.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped

volumes:
  pg_data:
