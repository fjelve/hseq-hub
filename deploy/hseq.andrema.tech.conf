# Nginx para HSEQ Hub. Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled.
# El dominio es una propuesta: ajustar si se elige otro.
server {
    listen 80;
    server_name hseq.andrema.tech;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        # Cloudflare envía CF-Connecting-IP; la API lo usa cuando TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
