<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSEQ Hub</title>
<style>
  :root { --bg:#0b1220; --side:#0f172a; --card:#1a2438; --txt:#e2e8f0; --mut:#8b9bb4; --ac:#f59e0b; --ok:#22c55e; --bad:#ef4444; --warn:#f97316; --line:#2a3650; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  #app { display:flex; min-height:100vh; }
  aside { width:220px; background:var(--side); padding:18px 12px; position:sticky; top:0; height:100vh; flex-shrink:0; }
  aside h1 { font-size:18px; margin:0 8px 4px; color:var(--ac); }
  aside small { display:block; margin:0 8px 18px; color:var(--mut); font-size:12px; }
  aside button.nav { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; margin-bottom:2px; }
  aside button.nav:hover, aside button.nav.on { background:var(--card); }
  aside button.nav.on { border-left:3px solid var(--ac); }
  .sp { height:16px; }
  section.main { flex:1; padding:22px 28px; max-width:1180px; }
  h2 { margin:0 0 16px; } h3 { margin:0 0 12px; font-size:16px; }
  .btn { background:var(--ac); color:#111; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600; margin-right:6px; }
  .btn.sec { background:#334155; color:var(--txt); }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:14px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .kpi { margin:0; } .kpi b { font-size:30px; display:block; } .kpi span { color:var(--mut); font-size:13px; } .kpi.bad b { color:var(--bad); } .kpi.good b { color:var(--ok); } .kpi.warn b { color:var(--warn); }
  input, select, textarea { width:100%; padding:8px; margin:4px 0 10px; border-radius:6px; border:1px solid #475569; background:#0b1220; color:var(--txt); }
  label { font-size:13px; color:var(--mut); }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:12px; text-transform:uppercase; }
  .tag { padding:2px 8px; border-radius:10px; font-size:12px; background:#334155; white-space:nowrap; }
  .critica, .vencido { background:var(--bad); } .alta, .por_vencer { background:var(--warn); color:#111; } .vigente { background:#166534; } .media { background:#92400e; }
  .vtxt { color:var(--bad); font-weight:700; }
  .hidden { display:none !important; } .err { color:var(--bad); }
  .item { padding:10px 0; border-bottom:1px solid var(--line); } .item .crit { color:var(--bad); font-size:12px; }
  .chart { display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:8px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:11px; color:var(--mut); }
  .col i { display:block; width:100%; max-width:46px; background:var(--ac); border-radius:4px 4px 0 0; min-height:2px; }
  .col em { font-style:normal; color:var(--txt); font-size:12px; margin-bottom:2px; }
  .hbar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .hbar span { width:150px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar i { display:block; height:14px; background:var(--ac); border-radius:3px; }
  .banner { background:linear-gradient(90deg,#78350f,#1a2438); border:1px solid var(--ac); }
  #login { max-width:420px; margin:60px auto; }
  @media (max-width:760px){ #app { flex-direction:column; } aside { width:100%; height:auto; position:static; display:flex; flex-wrap:wrap; gap:4px; } section.main { padding:14px; } }
</style>
</head>
<body>
<div id="login" class="card">
  <h2>HSEQ Hub</h2>
  <div id="loginForm">
    <label>Correo</label><input id="lEmail" type="email">
    <label>Contraseña</label><input id="lPass" type="password">
    <button class="btn" onclick="login()">Ingresar</button>
    <button class="btn sec" id="btnReg" onclick="toggleReg(true)">Crear empresa</button>
    <p id="loginHint" class="hidden" style="color:var(--mut);font-size:13px">Acceso solo por invitación. Si necesitas una cuenta, contacta al administrador de la plataforma.</p>
  </div>
  <div id="regForm" class="hidden">
    <label>Empresa</label><input id="rEmp">
    <label>Sector</label><select id="rSec"><option value="mineria">Minería</option><option value="industria">Industria</option></select>
    <label>País</label><select id="rPai"><option value="chile">Chile</option><option value="peru">Perú</option></select>
    <label>Tu nombre</label><input id="rNom">
    <label>Correo</label><input id="rEmail" type="email">
    <label>Contraseña (mín. 10 caracteres)</label><input id="rPass" type="password">
    <button class="btn" onclick="registro()">Crear cuenta</button>
    <button class="btn sec" onclick="toggleReg(false)">Volver</button>
  </div>
  <p id="loginErr" class="err"></p>
</div>

<div id="app" class="hidden">
  <aside>
    <h1>HSEQ Hub</h1><small id="who"></small>
    <button class="nav" data-v="dash" onclick="vista('dash')">📊 Resumen</button>
    <button class="nav" data-v="hall" onclick="vista('hall')">⚠️ Hallazgos y CAPA</button>
    <button class="nav" data-v="aud" onclick="vista('aud')">✅ Auditorías</button>
    <button class="nav" data-v="inc" onclick="vista('inc')">🚑 Incidentes</button>
    <button class="nav" data-v="leg" onclick="vista('leg')">📜 Requisitos legales</button>
    <button class="nav" data-v="amb" onclick="vista('amb')">🌱 Sostenibilidad</button>
    <button class="nav" data-v="bit" onclick="vista('bit')">🔒 Bitácora</button>
    <button class="nav" data-v="emp" onclick="vista('emp')">🏢 Empresas</button>
    <button class="nav" data-v="pwd" onclick="vista('pwd')">🔑 Mi contraseña</button>
    <div class="sp"></div>
    <button class="nav" onclick="salir()">Salir</button>
  </aside>
  <section class="main" id="main"></section>
</div>

<script>
// Mismo origen que la API (la API sirve este archivo). Solo si se abre desde otro puerto local
// (p. ej. un servidor estático en :8080) se apunta a la API en :8000.
const API = (window.HSEQ_API || (location.hostname === "localhost" && location.port === "8080" ? "http://localhost:8000" : location.origin)) + "/api/v1";
let token = sessionStorage.getItem("tk"), yo = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const NOMBRE = {accidente_ctp:"Accidente con tiempo perdido", accidente_stp:"Accidente sin tiempo perdido", casi_accidente:"Casi accidente", ambiental:"Incidente ambiental", dano_propiedad:"Daño a la propiedad",
  energia_kwh:"Energía (kWh)", agua_m3:"Agua (m³)", combustible_l:"Combustible (L)", residuos_peligrosos_kg:"Residuos peligrosos (kg)", residuos_no_peligrosos_kg:"Residuos no peligrosos (kg)"};
const hoyISO = () => new Date().toISOString().slice(0, 10);
const mesISO = () => hoyISO().slice(0, 7);

async function api(path, opts = {}) {
  const h = {"Authorization": "Bearer " + token};
  if (opts.body) h["Content-Type"] = "application/json";
  const r = await fetch(API + path, {...opts, headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 401) { salir(); throw new Error("Sesión expirada"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Datos inválidos");
  return d;
}
function toggleReg(v) { $("loginForm").classList.toggle("hidden", v); $("regForm").classList.toggle("hidden", !v); }
async function auth(url, init) {
  $("loginErr").textContent = "";
  try {
    const r = await fetch(API + url, init); const d = await r.json();
    if (r.status === 429) throw new Error("Demasiados intentos. Espera unos minutos e inténtalo de nuevo.");
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Revisa los datos ingresados");
    token = d.access_token; sessionStorage.setItem("tk", token); await iniciar();
  } catch (e) { $("loginErr").textContent = e.message; }
}
const login = () => auth("/auth/login", {method:"POST", body:new URLSearchParams({username:$("lEmail").value, password:$("lPass").value})});
const registro = () => auth("/auth/registro", {method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify({empresa:$("rEmp").value, sector:$("rSec").value, pais:$("rPai").value, nombre:$("rNom").value, email:$("rEmail").value, password:$("rPass").value})});
function salir() { sessionStorage.removeItem("tk"); token = null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); toggleReg(false); }
async function iniciar() {
  yo = await api("/auth/me");
  const sup = yo.rol === "superadmin";
  $("who").textContent = sup ? `Plataforma · ${yo.nombre}` : `${yo.empresa} · ${yo.pais === "peru" ? "Perú" : "Chile"} · ${yo.rol}`;
  document.querySelectorAll("aside .nav[data-v]").forEach(b => { const v = b.dataset.v;
    b.classList.toggle("hidden", yo.debe_cambiar_password ? v !== "pwd" : sup ? !(v === "emp" || v === "pwd") : v === "emp"); });
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  vista(yo.debe_cambiar_password ? "pwd" : sup ? "emp" : "dash");
}
const VISTAS = {};
function vista(v) {
  if (yo && yo.debe_cambiar_password) v = "pwd";
  document.querySelectorAll("aside .nav").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  VISTAS[v]().catch(e => $("main").innerHTML = `<p class="err">${esc(e.message)}</p>`);
}
const run = async (fn, errId) => { try { await fn(); } catch (e) { const el = $(errId); el ? el.textContent = e.message : alert(e.message); } };

/* ---------- gráficos simples ---------- */
function barras(datos, color) {
  const max = Math.max(1, ...datos.map(d => d.v));
  if (!datos.length) return "<p style='color:var(--mut)'>Sin datos</p>";
  return `<div class="chart">${datos.map(d => `<div class="col"><em>${esc(d.v)}</em><i style="height:${Math.round(100 * d.v / max)}%;${color ? "background:" + color : ""}"></i>${esc(d.l)}</div>`).join("")}</div>`;
}
function hbarras(obj) {
  const e = Object.entries(obj), max = Math.max(1, ...e.map(x => x[1]));
  return e.map(([k, v]) => `<div class="hbar"><span title="${esc(k)}">${esc(k || "Sin área")}</span><i style="width:${Math.round(180 * v / max)}px"></i>${esc(v)}</div>`).join("") || "<p style='color:var(--mut)'>Sin datos</p>";
}
const kpi = (n, t, cls = "") => `<div class="card kpi ${cls}"><b>${esc(n ?? "—")}</b><span>${t}</span></div>`;

/* ---------- Resumen ---------- */
VISTAS.dash = async () => {
  const d = await api("/dashboard"), s = d.seguridad;
  const vacio = !d.hallazgos_abiertos && !d.tendencia_cumplimiento.length && !s.horas_12m;
  const sevOrden = ["critica", "alta", "media", "baja"];
  $("main").innerHTML = `<h2>Resumen</h2>
  ${vacio && yo.rol === "admin" ? `<div class="card banner"><h3>Tu cuenta está vacía</h3>
    <p>Carga datos de ejemplo (auditorías, hallazgos, incidentes, permisos e indicadores) para ver cómo funciona la plataforma.</p>
    <button class="btn" onclick="cargarDemo()">Cargar datos de ejemplo</button> <span id="dErr" class="err"></span></div>` : ""}
  <div class="grid">
    ${kpi(d.hallazgos_abiertos, "Hallazgos abiertos")}
    ${kpi(d.hallazgos_vencidos, "Hallazgos vencidos", d.hallazgos_vencidos ? "bad" : "good")}
    ${kpi(d.cumplimiento_promedio == null ? null : d.cumplimiento_promedio + "%", "Cumplimiento promedio de auditorías")}
    ${kpi(d.requisitos_vencidos + d.requisitos_por_vencer, `Permisos por vencer (${d.requisitos_vencidos} vencidos)`, d.requisitos_vencidos ? "bad" : d.requisitos_por_vencer ? "warn" : "good")}
  </div>
  <div class="grid">
    ${kpi(s.dias_sin_accidente_ctp, "Días sin accidente con tiempo perdido", "good")}
    ${kpi(s.indice_frecuencia, "Índice de frecuencia (12 m)")}
    ${kpi(s.indice_severidad, "Índice de severidad (12 m)")}
    ${kpi(s.casi_accidentes_12m, "Casi accidentes reportados (12 m)")}
    ${kpi(d.emisiones.total || null, "t CO₂e emitidas (12 m)")}
    ${kpi(d.metas.length ? d.metas.filter(m => m === "atrasada").length + " de " + d.metas.length : null, "Metas de sostenibilidad atrasadas", d.metas.includes("atrasada") ? "bad" : "good")}
  </div>
  <div class="grid2">
    <div class="card"><h3>Tendencia de cumplimiento (%)</h3>${barras(d.tendencia_cumplimiento.map(t => ({l: t.fecha.slice(5), v: t.puntaje})), "var(--ok)")}</div>
    <div class="card"><h3>Incidentes por mes</h3>${barras(Object.entries(s.incidentes_por_mes).map(([k, v]) => ({l: k.slice(2), v})))}</div>
    <div class="card"><h3>Hallazgos abiertos por área</h3>${hbarras(d.abiertos_por_area)}</div>
    <div class="card"><h3>Hallazgos abiertos por severidad</h3>${
      sevOrden.filter(k => d.abiertos_por_severidad[k]).map(k => `<span class="tag ${k}">${k}: ${d.abiertos_por_severidad[k]}</span> `).join("") || "Sin hallazgos abiertos"}
      <p style="color:var(--mut);font-size:12px;margin-top:14px">Índices por millón de horas trabajadas. Frecuencia = accidentes con tiempo perdido; severidad = días perdidos. Registra las horas en Incidentes.</p></div>
  </div>`;
};
async function cargarDemo() { await run(async () => { await api("/demo/cargar", {method:"POST"}); vista("dash"); }, "dErr"); }

/* ---------- Hallazgos ---------- */
VISTAS.hall = async () => {
  const hs = await api("/hallazgos");
  $("main").innerHTML = `<h2>Hallazgos y acciones correctivas</h2>
    <div class="card"><h3>Nuevo hallazgo</h3><div class="row">
      <div><label>Título</label><input id="hT"></div><div><label>Área</label><input id="hA"></div>
      <div><label>Severidad</label><select id="hS"><option>baja</option><option selected>media</option><option>alta</option><option>critica</option></select></div></div>
    <label>Descripción</label><textarea id="hD"></textarea>
    <button class="btn" onclick="crearH()">Registrar</button> <span id="hErr" class="err"></span></div>
    <div class="card"><h3>Hallazgos (${hs.length})</h3><table><tr><th>Código</th><th>Título</th><th>Área</th><th>Sev.</th><th>Estado</th><th>Compromiso</th><th></th></tr>${
    hs.map(h => `<tr><td>${esc(h.codigo)}</td><td>${esc(h.titulo)}</td><td>${esc(h.area)}</td><td><span class="tag ${esc(h.severidad)}">${esc(h.severidad)}</span></td>
      <td>${esc(h.estado.replace("_", " "))}</td><td class="${h.vencido ? "vtxt" : ""}">${esc(h.fecha_compromiso || "")}${h.vencido ? " (vencido)" : ""}</td>
      <td>${h.estado !== "cerrado" ? `<button class="btn sec" onclick="gestionar(${Number(h.id)})">Gestionar</button>` : ""}</td></tr>`).join("")}</table></div>
    <div id="gest"></div>`;
};
const crearH = () => run(async () => { await api("/hallazgos", {method:"POST", body:{titulo:$("hT").value, descripcion:$("hD").value, severidad:$("hS").value, area:$("hA").value, origen:"otro"}}); vista("hall"); }, "hErr");
async function gestionar(id) {
  const h = await api("/hallazgos/" + id);
  $("gest").innerHTML = `<div class="card"><h3>${esc(h.codigo)} · ${esc(h.titulo)}</h3>
    <label>Causa raíz</label><textarea id="gC">${esc(h.causa_raiz)}</textarea>
    <label>Método</label><select id="gM"><option value="5_porques">5 Porqués</option><option value="ishikawa">Ishikawa</option><option value="otro">Otro</option></select>
    <button class="btn sec" onclick="guardarCausa(${id})">Guardar causa</button>
    <h4>Acciones</h4>${h.acciones.map(a => `<div class="item">${esc(a.tipo)}: ${esc(a.descripcion)} ${a.completada ? "✔ " + esc(a.evidencia)
      : `<button class="btn sec" onclick="completar(${id},${Number(a.id)})">Completar</button>`}</div>`).join("") || "<p>Sin acciones</p>"}
    <label>Nueva acción</label><input id="gA"><button class="btn sec" onclick="addAccion(${id})">Agregar</button>
    <h4>Cierre</h4><label>Verificación de eficacia</label><textarea id="gV"></textarea>
    <button class="btn" onclick="cerrarH(${id})">Cerrar hallazgo</button> <span id="gErr" class="err"></span></div>`;
  $("gM").value = h.metodo_causa || "5_porques";
  $("gest").scrollIntoView({behavior:"smooth"});
}
const reG = id => gestionar(id);
const guardarCausa = id => run(async () => { await api("/hallazgos/" + id, {method:"PATCH", body:{causa_raiz:$("gC").value, metodo_causa:$("gM").value}}); reG(id); }, "gErr");
const addAccion = id => run(async () => { await api(`/hallazgos/${id}/acciones`, {method:"POST", body:{descripcion:$("gA").value}}); reG(id); }, "gErr");
const completar = (id, aid) => { const ev = prompt("Evidencia de la acción:"); if (ev) run(async () => { await api(`/hallazgos/${id}/acciones/${aid}/completar`, {method:"POST", body:{evidencia:ev}}); reG(id); }, "gErr"); };
const cerrarH = id => run(async () => { await api(`/hallazgos/${id}/cerrar`, {method:"POST", body:{verificacion_eficacia:$("gV").value}}); vista("hall"); }, "gErr");

/* ---------- Auditorías ---------- */
VISTAS.aud = async () => {
  const [as, ps] = await Promise.all([api("/auditorias"), api("/plantillas?sector=" + yo.sector)]);
  const nombre = id => (ps.find(p => p.id === id) || {}).nombre || "Plantilla " + id;
  $("main").innerHTML = `<h2>Auditorías</h2><div class="card"><h3>Programar auditoría</h3><div class="row">
    <div><label>Checklist</label><select id="aP">${ps.map(p => `<option value="${Number(p.id)}">${esc(p.nombre)} (${esc(p.norma)})</option>`).join("")}</select></div>
    <div><label>Área</label><input id="aA"></div></div>
    <button class="btn" onclick="crearA()">Programar</button> <span id="aErr" class="err"></span></div>
    <div class="card"><h3>Auditorías</h3><table><tr><th>#</th><th>Checklist</th><th>Área</th><th>Fecha</th><th>Estado</th><th>Puntaje</th><th></th></tr>${
    as.map(a => `<tr><td>${Number(a.id)}</td><td>${esc(nombre(a.plantilla_id))}</td><td>${esc(a.area)}</td><td>${esc(a.fecha_programada)}</td><td>${esc(a.estado)}</td><td>${a.puntaje == null ? "" : esc(a.puntaje) + "%"}</td>
      <td>${a.estado !== "cerrada" ? `<button class="btn sec" onclick="ejecutar(${Number(a.id)})">Ejecutar</button>` : ""}</td></tr>`).join("")}</table></div><div id="exec"></div>`;
};
const crearA = () => run(async () => { await api("/auditorias", {method:"POST", body:{plantilla_id:Number($("aP").value), area:$("aA").value}}); vista("aud"); }, "aErr");
async function ejecutar(id) {
  const a = await api("/auditorias/" + id);
  const pl = (await api("/plantillas")).find(p => p.id === a.plantilla_id);
  const resp = Object.fromEntries(a.respuestas.map(r => [r.item_id, r.resultado]));
  $("exec").innerHTML = `<div class="card"><h3>${esc(pl.nombre)}</h3>${pl.items.map(i => `<div class="item">
    <div>${esc(i.clausula)} · ${esc(i.texto)} ${i.critico ? '<span class="crit">CRÍTICO</span>' : ""}</div>
    <select onchange="responder(${id},${Number(i.id)},this.value)"><option value="">— Seleccionar —</option>
    ${["cumple","no_cumple","na"].map(r => `<option value="${r}" ${resp[i.id] === r ? "selected" : ""}>${r.replace("_"," ")}</option>`).join("")}</select></div>`).join("")}
    <button class="btn" onclick="cerrarA(${id})">Cerrar auditoría y generar hallazgos</button> <span id="eErr" class="err"></span></div>`;
  $("exec").scrollIntoView({behavior:"smooth"});
}
const responder = (aid, iid, v) => v && run(() => api(`/auditorias/${aid}/respuestas`, {method:"PUT", body:{item_id:iid, resultado:v}}), "eErr");
const cerrarA = id => run(async () => { await api(`/auditorias/${id}/cerrar`, {method:"POST"}); vista("aud"); }, "eErr");

/* ---------- Incidentes ---------- */
VISTAS.inc = async () => {
  const [is, hs, k] = await Promise.all([api("/incidentes"), api("/horas-trabajadas"), api("/kpis-seguridad")]);
  $("main").innerHTML = `<h2>Incidentes y seguridad</h2>
  <div class="grid">${kpi(k.dias_sin_accidente_ctp, "Días sin accidente con tiempo perdido", "good")}${kpi(k.indice_frecuencia, "Índice de frecuencia")}
    ${kpi(k.indice_severidad, "Índice de severidad")}${kpi(k.horas_12m.toLocaleString("es"), "Horas trabajadas (12 m)")}</div>
  <div class="grid2"><div class="card"><h3>Registrar incidente</h3><div class="row">
    <div><label>Tipo</label><select id="iT">${["accidente_ctp","accidente_stp","casi_accidente","ambiental","dano_propiedad"].map(t => `<option value="${t}">${NOMBRE[t]}</option>`).join("")}</select></div>
    <div><label>Fecha</label><input id="iF" type="date" value="${hoyISO()}"></div>

      <td>${r.valor == null ? "—" : esc(Number(r.valor).toLocaleString("es"))}</td><td>${esc(r.unidad)}</td>
      <td><span class="tag ${r.reportable ? "vigente" : "por_vencer"}">${r.reportable ? "con dato" : "falta dato"}</span></td></tr>`).join("")}</table>
    <br><button class="btn" onclick="descargarGri()">Descargar CSV</button></div>`;
}
function descargarGri() {
  const cel = c => { let s = String(c ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const filas = [["Codigo","Indicador","Valor","Unidad","Nota"], ...window._gri.map(r => [r.codigo, r.indicador, r.valor, r.unidad, r.nota])];
  const blob = new Blob(["\uFEFF" + filas.map(f => f.map(cel).join(",")).join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "indice_gri.csv"; a.click(); URL.revokeObjectURL(a.href);
}

VISTAS.bit = async () => {

    <button class="btn" onclick="verificarBit()">Verificar integridad</button> <span id="bitRes"></span></div>

    es.map(e => `<tr><td>${esc(e.seq)}</td><td>${esc(e.ts.slice(0, 19).replace("T", " "))}</td><td>${esc(e.actor)}</td><td>${esc(e.accion)}</td>
      <td><small>${esc(e.datos)}</small></td><td><code title="${esc(e.hash)}">${esc(e.hash.slice(0, 10))}…</code></td></tr>`).join("")}</table></div>`;

async function verificarBit() {
  try {
    const v = await api("/bitacora/verificar");
    $("bitRes").innerHTML = v.valida
      ? `<span class="tag vigente">Íntegra</span> ${esc(v.entradas)} entradas · último hash <code>${esc(v.ultimo_hash)}</code>`
      : `<span class="tag vencido">ALTERADA</span> en la entrada ${esc(v.primer_error.seq)}: ${esc(v.primer_error.motivo)}`;
  } catch (e) { $("bitRes").textContent = e.message; }
}
